
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cheery's Bags - Login Form</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;

            background-image: url("3.jpg");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        .login-box {
            width: 100%;
            max-width: 350px;
            padding: 30px;

            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);

            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 15px;
            text-align: center;
            color: black;

            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.3);
        }

        .login-logo {
            width: 75px;
            height: 75px;
            border-radius: 50%;
            margin-bottom: 15px;
            object-fit: cover;
        }

        h2 {
            font-size: 24px;
            margin-bottom: 20px;
        }

        .input-group {
            width: 100%;
            margin-bottom: 12px;
        }

        input {
            display: block;
            width: 100%;
            padding: 12px;

            background: rgba(255, 255, 255, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.7);
            border-radius: 8px;

            color: black;
            font-size: 16px;
            outline: none;
        }

        input::placeholder {
            color: #333;
        }

        input:focus {
            border-color: #F527D6;
            box-shadow: 0 0 5px rgba(245, 39, 214, 0.4);
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 5px;

            background: #F527D6;
            color: black;
            border: none;
            border-radius: 8px;

            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: 0.3s;
        }

        button:hover {
            background: #df18bf;
            color: white;
        }

        .error-message {
            display: none;
            color: darkred;
            font-size: 14px;
            font-weight: bold;
            margin-top: 15px;
            overflow-wrap: anywhere;
        }

        /* Responsive for mobile phones */
        @media screen and (max-width: 480px) {
            body {
                padding: 15px;
            }

            .login-box {
                max-width: 100%;
                padding: 22px;
            }

            .login-logo {
                width: 60px;
                height: 60px;
            }

            h2 {
                font-size: 21px;
            }
        }

        /* Responsive for tablets */
        @media screen and (min-width: 481px)
        and (max-width: 768px) {
            .login-box {
                max-width: 380px;
                padding: 28px;
            }
        }

        /* Short screens and landscape phones */
        @media screen and (max-height: 500px) {
            body {
                align-items: flex-start;
            }

            .login-box {
                margin-top: 10px;
                margin-bottom: 10px;
            }
        }
    </style>
</head>

<body>

    <div class="login-box">

        <img src="logo.jpg"
             alt="Cheery's Bags Logo"
             class="login-logo">

        <h2>Login Form</h2>

        <form id="loginForm">

            <div class="input-group">
                <input
                    type="text"
                    id="username"
                    placeholder="Enter username"
                    autocomplete="username"
                    required>
            </div>

            <div class="input-group">
                <input
                    type="password"
                    id="password"
                    placeholder="Enter password"
                    autocomplete="current-password"
                    required>
            </div>

            <button type="submit">Login</button>

            <div id="errorMsg"
                 class="error-message"
                 role="alert">
                Invalid username or password!
                Please try again.
            </div>

        </form>

    </div>

    <script>
        document.getElementById("loginForm")
            .addEventListener("submit", function(event) {

                event.preventDefault();

                var user =
                    document.getElementById("username").value;

                var pass =
                    document.getElementById("password").value;

                var error =
                    document.getElementById("errorMsg");

                if (user === "cheery" && pass === "miranda") {

                    error.style.display = "none";

                    window.location.href = "home page.html";

                } else {

                    error.style.display = "block";

                }
            });
    </script>

</body>
</html>
